global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - localhost:9100

  - job_name: "application"
    static_configs:
      - targets:
          - app-service:3000

  - job_name: "postgres"
    static_configs:
      - targets:
          - postgres-exporter:9187
